name: Environment image check

# Runs the image check (pass rule 1: Python, CUDA toolkit and every pin of upstream's
# requirements.txt) on the image digest the eval pins in
# src/researcharena_inspect/environment/image.py, without rebuilding it.
on:
  push:
    paths:
      - src/researcharena_inspect/environment/image.py
      - src/researcharena_inspect/environment/image_check.py
      - .github/workflows/environment-image-check.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: environment-image-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # with an explicit shell, run steps use -eo pipefail

jobs:
  check:
    name: Check the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h /

      - name: Pull the pinned image
        id: image
        run: |
          image="$(python3 -c "import ast, pathlib; t = ast.parse(pathlib.Path('src/researcharena_inspect/environment/image.py').read_text()); v = {n.target.id: n.value.value for n in t.body if isinstance(n, ast.AnnAssign) and isinstance(n.value, ast.Constant)}; print(v['IMAGE_REPOSITORY'] + '@' + v['IMAGE_DIGEST'])")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          docker pull --platform linux/amd64 "$image"
          echo "unpacked size: $(docker image inspect --format '{{.Size}}' "$image") bytes"

      - name: Check the image against requirements.txt (pass rule 1)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set +e
          docker run --rm --entrypoint python3 \
            -v "$PWD/src/researcharena_inspect/environment/image_check.py:/check.py:ro" \
            "$IMAGE" /check.py > image_check.json
          status=$?
          cat image_check.json
          {
            echo "## Image check (pass rule 1)"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Exit status: ${status}"
            echo
            echo '```json'
            python3 -c "import json; r = json.load(open('image_check.json')); r.pop('pins'); print(json.dumps(r, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the check output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-image-check
          path: image_check.json
          if-no-files-found: ignore
