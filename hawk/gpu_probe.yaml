# Hawk eval set that runs the gpu_probe task once: `hawk eval-set run hawk/gpu_probe.yaml`.
# The task makes no model calls; Hawk still requires one real model to be declared.
name: gpu-probe
tags: [gpu-probe]
tasks:
  - package: git+https://github.com/archit-manek/researcharena-inspect@9eb8d7cab75b19983649b164c1098d692d03d5ef
    name: researcharena_inspect
    items:
      - name: gpu_probe
models:
  - package: openai
    name: openai
    items:
      - name: gpt-5.4-mini
limit: 1
time_limit: 600
retry_attempts: 0
