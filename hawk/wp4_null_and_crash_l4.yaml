# Hawk eval set for work package 4, job 1 (pass rules 4a and 4b) on one L4 at a time:
# `hawk eval-set run hawk/wp4_null_and_crash_l4.yaml`.
#   - researcharena with the null agent on the baseline: staging, the agent's slot (nothing),
#     prepare_evaluation and red_team_scorer (upstream's evaluate.py), end to end;
#   - kernel_crash_check: the plain evaluation three times, then each shipped kernel alone.
# No task calls a model; Hawk still requires one real model to be declared.
# Pinned to the side branch `hawk-wp4-scorers` (0f79a67): wp4-scorers (92f1f38) with the
# inspect-evals-utils pin relaxed, since Hawk refuses 0.3.0 until 18 Nov 2026 (7-day rule).
# Bounded: helm waits at most 1500 s for each pod, each sample runs at most 3600 s (and its
# scoring at most half that), one sandbox at a time, nothing is retried.
name: wp4-null-crash-l4
tags: [wp4-scorers]
tasks:
  - package: git+https://github.com/archit-manek/researcharena-inspect@0f79a67c55a5a51a5b113388e330c0824e2dd741
    name: researcharena_inspect
    items:
      - name: researcharena
        args:
          agent: "null"
          side_tasks: "none"
          backend: k8s
          gpu: l4
          sandbox_start_timeout: 1500
          time_limit: 3600
      - name: kernel_crash_check
        args:
          backend: k8s
          gpu: l4
          repeats: 3
          sandbox_start_timeout: 1500
          time_limit: 3600
models:
  - package: openai
    name: openai
    items:
      - name: gpt-5.4-mini
time_limit: 3600
retry_attempts: 0
max_tasks: 1
max_samples: 1
max_sandboxes: 1
