[build-system]
requires = ["setuptools>=77"] # 77 is the first to accept an SPDX string in [project] license
build-backend = "setuptools.build_meta"

[project]
name = "researcharena-inspect"
version = "0.1.0"
description = "Inspect port of ResearchArena, a control evaluation of sabotage and monitoring in automated AI R&D"
readme = "README.md"
license = "MIT"
authors = [{ name = "Archit Manek", email = "architmanek@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "inspect_ai>=0.3.262",
    "inspect-evals-utils[huggingface]==0.3.0",
    # The Claude Code monitor. <0.3.0 until 0.3.0 (12 Nov 2026) has been on PyPI for 7 days.
    "inspect-swe>=0.2.72,<0.3.0",
]

[project.urls]
Repository = "https://github.com/archit-manek/researcharena-inspect"
Issues = "https://github.com/archit-manek/researcharena-inspect/issues"

# Registers the package so `inspect eval researcharena_inspect/<task>` finds its tasks.
[project.entry-points.inspect_ai]
researcharena_inspect = "researcharena_inspect"

[dependency-groups]
dev = [
    "anthropic>=2.0", # with openai, the SDKs behind the `--model` commands in the READMEs
    "basedpyright>=1.40",
    "inspect-evals-lint==0.13.0",
    "inspect-scout>=0.6.2", # used by agent_artefacts/trajectory_analysis/inspect_scout/
    "openai>=3.4",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-asyncio",
    "pytest-dotenv",
    "pytest-inspect-evals[huggingface]==0.4.0",
    "pytest-mock",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["researcharena_inspect*"] # examples/ stays out of the wheel

[tool.setuptools.package-data]
"*" = [
    "eval.yaml",
    "gpu_probe_values.yaml",
    "run_configs/*.yaml", # `inspect eval --run-config` files (original.yaml)
    "data/*.json.gz",
    # environment/: the agent's sandbox configs and the Dockerfile they were built from
    "compose.yaml",
    "k8s_values_*.yaml",
    "Dockerfile",
]

# Layout preset: multi-eval (tests/<package>/, src/<package>/README.md) or
# single-eval (flat tests/, README at the root). A hybrid repo keeps a preset and
# sets tests_layout or readme_location here on top of it.
[tool.inspect-evals-lint]
preset = "multi-eval"

[tool.inspect-evals-lint.per-file-ignores]
# kernel_bench.py runs in the sandbox image (PyTorch, transformers, upstream's bench.py).
"src/researcharena_inspect/scoring/kernel_bench.py" = ["external_dependencies"]
# The GPU sandbox check is `environment_check` (kind: maintenance), which builds the kernels and
# runs upstream's evaluate.py in the pinned image. It predates the `<eval>_sandbox_check` name
# the rule looks for, and a fixture workspace with a known verdict is not settled while the
# untouched kernels fault on the L4 (ledger D-037).
"src/researcharena_inspect/eval.yaml" = ["gpu_sandbox_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-rA --durations=10 --color=yes"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_level = "WARNING"
env_files = [".env"]
# Test gates and markers come from pytest-inspect-evals. Dataset-download tests
# run by default; set RUN_DATASET_DOWNLOAD_TESTS=0 to skip them.
inspect_evals_dataset_download = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
exclude = [".venv", "agent_artefacts", "build"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"
# *.md: ruff formats Python blocks in Markdown, and the README generator writes them its own way.
extend-exclude = ["agent_artefacts", "*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    "E501",   # line-too-long: the formatter owns line length
    "D10",    # missing docstrings
    "D415",   # first-line punctuation
    "ISC001", # single-line implicit concat conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests,examples}/**" = ["D", "PLR2004"] # tests and examples skip docstring linting
