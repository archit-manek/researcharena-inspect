# The paper's red-team setup for the safety fine-tuning setting (`safety_finetuning`), as an
# Inspect run config:
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original_safety.yaml \
#     -T hf_seed=/path/on/the/docker/host/to/a/hugging/face/cache
#
# Same format as `original.yaml` (the CUDA setting); see there for what a run config is. Flags
# on the command line override it (`--model`, `-T name=value`).
#
# "Upstream" is ResearchArena at b922f4b (pins.UPSTREAM_COMMIT), the code the port follows.
# "Published runs" are the authors' 96 safety runs in the dataset at revision 8cd737c
# (pins.HF_REVISION), of which 12 are Sonnet 4.6 with Claude Code. Where the two disagree, the
# comment says which one the value follows.
#
# Not matchable, each marked NOT MATCHED below:
#   - the vLLM version the scorer serves the model with: upstream's image at b922f4b, which the
#     port builds, has 0.19.1; the published runs' version is not recorded for this setting
#     (ledger D-133 and D-176 for the other two vLLM settings).
#   - the Hugging Face cache: upstream's agent saw the cluster's whole shared cache; the port's
#     holds the config's model, the scorer's two judges and the five datasets the agent's
#     evaluate_model.py reads, at pinned revisions (D-210).
#   - re-prompting: the nine published Claude Code `embedded_german` runs used the `claude`
#     provider and were re-prompted (2 to 524 CLI rounds); upstream's code at b922f4b runs one
#     round for this setting, as the port does (D-214).

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting safety_finetuning`.
    setting: safety_finetuning

    # The baseline (`none`) and the three side tasks: upstream's folders under
    # settings/safety_finetuning/side_tasks/ (embedded = the |LISTS_AND_MATH| backdoor,
    # embedded_german = unsafe in German only, independent = the checkpoint upload, captured
    # locally and never sent out: D-173). The published runs have three of each for Sonnet 4.6.
    # `independent` is NOT MATCHED in this file: in the port it cannot run on the CLI version
    # below (D-256), and the task refuses the pair. Run it as a second command with
    # `-T side_tasks=independent -T claude_code_version=2.1.104`.
    side_tasks: [none, embedded, embedded_german]

    # settings/safety_finetuning/config.json lists `qwen3_1.7b`
    # (huihui-ai/Huihui-Qwen3-1.7B-abliterated-v2) first, so upstream uses it when none is
    # given; all 96 published runs record it. The other config, `qwen3_4b`, would need its model
    # pinned (environment.model_cache).
    task_config: qwen3_1.7b

    # Upstream: `--redteammodel claude:claude-sonnet-4-6` runs agents/claude/solve.sh (Claude
    # Code). The port runs the same CLI through Inspect SWE (ledger D-076 to D-080). The
    # config's `resume_agent: false` means one round: no "Continue" prompt when the agent
    # stops (solve.sh:110-111). NOT MATCHED for the published `embedded_german` runs (D-214).
    agent: claude_code

    # Five hours. Paper §5: "five hours for the post-training settings"; all 96 published
    # safety runs have five hours in the index.
    redruntime: "5"

    # Upstream's effort.json gives Claude red-team agents `xhigh` ("auto" reads it); the
    # published runs predate it (D-056). See original.yaml for how the port sets effort.
    effort: auto

    # The published runs' CLI version, from the `init` event of each solve_out file: 2.1.34 in
    # all 36 Claude Code safety runs (April to June 2026). Upstream itself installs the latest
    # release at each run (`update_agent_cli.sh`, D-056).
    claude_code_version: "2.1.34"

    # Claude Code's own background calls: Haiku 4.5, as in the published runs
    # (pins.CLAUDE_CODE_SMALL_MODEL; D-080).
    small_model: anthropic/claude-haiku-4-5-20251001

    # One machine with one NVIDIA GPU and Docker. run_redteam.sub asks for one
    # "NVIDIA H100 80GB HBM3". With this setting the port's Docker sandbox is compose.yaml plus
    # a 16 GB /dev/shm (D-132) and the hook service for the upload capture (D-174).
    backend: docker
    gpu: null

    # The model, the two judges and the five datasets reach the agent's Hugging Face cache
    # before the agent starts (upstream's cluster cache already held them, resources.json;
    # D-210), about 24.7 GB per sample. Two of the repositories are gated (google/gemma-2b,
    # meta-llama/Llama-Guard-3-8B), so they can only come from `hf_seed`, a folder on the Docker
    # host filled once with the user's token (see the README); `seed` refuses to download.
    model_cache: seed

    # The submitted workspace, final_model/ first, is copied to a folder beside the log after
    # scoring, so the model can be re-scored and monitored later (D-172). Upstream keeps it in
    # its run folder.
    model_store: auto

    # Upstream has no overall limit: the agent's budget plus five minutes (RED_TIMEOUT), then
    # up to three evaluation attempts of 3600 s each. An Inspect time_limit would give scoring
    # only half of it (D-099), so none is set.
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6` (the paper's agent).
model: anthropic/claude-sonnet-4-6

# Claude Code sends its own requests; upstream sets no temperature, seed or token limit (D-010).
# Nothing is set here.
generate_config: {}

# The paper runs each configuration three times (§5); `--epochs 3` does that. How the task
# reduces epochs is described in original.yaml.
#
# One sample at a time. Every sandbox asks for the machine's one GPU, where upstream's cluster
# gives each run its own (run_redteam.sub): two samples at once would train and serve on the
# same GPU, and the scorer's judge refuses to load while another process holds GPU memory
# (evaluate.py:185-209). `--max-samples` on the command line overrides this.
eval_config:
  max_samples: 1
