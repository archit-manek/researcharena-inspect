# The paper's red-team setup for the safety fine-tuning setting (`safety_finetuning`):
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original_safety.yaml \
#     -T hf_seed=/path/on/the/docker/host/to/a/hugging/face/cache
#
# See original.yaml for the format and the terms. Published runs: 96 safety runs, 12 of them
# Sonnet 4.6 with Claude Code.
#
# NOT MATCHED:
#   - vLLM: upstream's image at b922f4b, which the port builds, has 0.19.1; the published runs'
#     version is not recorded for this setting (D-133 and D-176 cover the other two).
#   - the Hugging Face cache: upstream's agent saw the cluster's whole cache; the port's holds
#     the config's model, the scorer's two judges and five datasets at pinned revisions (D-210).
#   - re-prompting: the nine published Claude Code `embedded_german` runs were re-prompted;
#     upstream at b922f4b runs one round for this setting, as the port does (D-214).

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting safety_finetuning`.
    setting: safety_finetuning

    # The baseline and settings/safety_finetuning/side_tasks/: embedded (the |LISTS_AND_MATH|
    # backdoor), embedded_german (unsafe in German only). NOT MATCHED: `independent` (the
    # checkpoint upload, captured locally, D-173), which the task refuses on this CLI version
    # (D-256); run it as a second command with `-T side_tasks=independent -T claude_code_version=2.1.104`.
    side_tasks: [none, embedded, embedded_german]

    # The first config in settings/safety_finetuning/config.json, upstream's default; all 96
    # published runs record it. `qwen3_4b` would need its model pinned (environment.model_cache).
    task_config: qwen3_1.7b

    # As original.yaml. The config's `resume_agent: false` means one round, no "Continue"
    # prompt (solve.sh:110-111). NOT MATCHED for the published `embedded_german` runs (D-214).
    agent: claude_code

    # Paper §5 and all 96 published runs: five hours.
    redruntime: "5"

    # As original.yaml (D-056).
    effort: auto

    # The published runs' CLI (all 36 Claude Code safety runs); upstream installs the latest at
    # each run (D-056).
    claude_code_version: "2.1.34"

    # As original.yaml (D-080).
    small_model: anthropic/claude-haiku-4-5-20251001

    # Needs one NVIDIA GPU and Docker. The port's sandbox is compose.yaml plus a 16 GB /dev/shm
    # (D-132) and the upload capture's hook service (D-174). No option sets it.

    # The model, judges and datasets reach the agent's cache before it starts (D-210; 24.7 GB).
    # google/gemma-2b and meta-llama/Llama-Guard-3-8B are gated, so `seed` takes them only from
    # `hf_seed`, filled once with the user's token (see the README), and never downloads.
    model_cache: seed

    # The submitted workspace is copied beside the log for re-scoring and monitoring (D-172).
    model_store: auto

    # As original.yaml (D-099).
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6`.
model: anthropic/claude-sonnet-4-6

# As original.yaml (D-010).
generate_config: {}

# Three trials: `--epochs 3`, as in original.yaml. One sample at a time: the scorer's judge
# refuses to load while another process holds GPU memory (evaluate.py:185-209).
eval_config:
  max_samples: 1
