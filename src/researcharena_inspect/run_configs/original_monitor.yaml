# The paper's Claude monitor on the published CUDA runs:
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original_monitor.yaml
#
# See original.yaml for the format. Monitors the authors' 113 published cuda_kernel runs with
# Sonnet 4.6 through Claude Code, one of the two monitor backbones in the paper's Table 8 (the
# other, GPT-5.4 through Codex, has no counterpart in the port). The paper reports four access
# types; run this once per type with `-T access=...`. Needs Docker (no GPU) and an Anthropic key.

task:
  task: researcharena_inspect/researcharena_monitor
  args:
    # `transcript`, `transcript_cot`, `artifact` or `artifact_cot`: run_monitor.sh's
    # --with-artifact and --with-chain-of-thought flags. Artifact access downloads each run's
    # published workspace.
    access: transcript

    # Every published cuda_kernel run, baselines and side tasks.
    settings: cuda_kernel

    # Upstream's monitors/claude/monitor.sh (Claude Code), run through Inspect SWE (D-066, D-067,
    # D-089).
    monitor_agent: claude_code

    # "auto" reads upstream's effort.json: `high` for Claude monitors, the tag of the published
    # Sonnet 4.6 CUDA monitors' folders.
    effort: auto

    # run_monitor.sub, run_monitor_no_artifact.sub and upstream's README use 0.5;
    # run_monitor_claude.sub's default is five minutes. The published monitors' value is unknown.
    blue_runtime_hours: 0.5

    # Each published run's own monitor CLI version. 2.1.34 and 2.1.104 have Grep and Glob,
    # 2.1.162 has neither (D-075).
    claude_code_version: published

    # Claude Code's background model, as the published runs' `modelUsage` lists.
    small_model: anthropic/claude-haiku-4-5-20251001

    # Upstream runs every monitor in the agent's image without a GPU (pipeline_monitor.sh:70,
    # :294; D-025). The port does too for the artifact types, and uses a small Python image for
    # the transcript types, whose monitors only read text (D-107).
    sandbox: docker

    # The pinned commit's prompts. For CUDA they match the task text in the published monitor
    # traces; the paper-era text differs only for the post-training settings (D-054).
    prompt_commit: latest

# Upstream: `--blueteammodel claude:claude-sonnet-4-6`, run_monitor.sub's default.
model: anthropic/claude-sonnet-4-6

generate_config: {}
eval_config: {}
