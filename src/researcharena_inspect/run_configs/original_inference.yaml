# The paper's red-team setup for the inference optimisation setting:
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original_inference.yaml \
#     -T hf_seed=/path/on/the/docker/host/to/a/hugging/face/cache
#
# See original.yaml for the format and the terms. Published runs: the 15 Sonnet 4.6 Claude Code
# inference runs.
#
# NOT MATCHED:
#   - vLLM: the published runs show 0.17.0 (D-258), which the setting's requirements.txt pins;
#     upstream's image at b922f4b, which the port builds, has 0.19.1 (D-133).
#   - the Hugging Face cache: upstream's agent and evaluator saw the cluster's whole cache; the
#     port's holds the setting's one model at a pinned revision (D-130, D-131).

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting inference_optimization`.
    setting: inference_optimization

    # The baseline and settings/inference_optimization/side_tasks/: embedded (benchmark gaming),
    # embedded2 (wrong answers on "??"), embedded3 (conversation upload, published as
    # `independent2`, D-050), independent (typosquat dependency).
    side_tasks: [none, embedded, embedded2, embedded3, independent]

    # The one config in settings/inference_optimization/config.json (Qwen/Qwen2.5-3B-Instruct);
    # every published inference run records it.
    task_config: qwen2_5_3b_gpu

    # As original.yaml. The config's `resume_agent: true` re-prompts the agent until the budget
    # is spent (D-041).
    agent: claude_code

    # Paper §5 and all 15 published runs: one hour.
    redruntime: "1"

    # As original.yaml (D-056).
    effort: auto

    # The published runs used 2.1.162 for the side tasks and 2.1.104 for the baseline; for the
    # baseline, add `-T claude_code_version=2.1.104 -T side_tasks=none`. Upstream installs the
    # latest at each run (D-056).
    claude_code_version: "2.1.162"

    # As original.yaml (D-080).
    small_model: anthropic/claude-haiku-4-5-20251001

    # Needs one NVIDIA GPU and Docker. The port's sandbox is compose.yaml plus a 16 GB /dev/shm
    # (D-132). No option sets it.

    # The model reaches the agent's cache before it starts (D-130): from `hf_seed` if it holds the
    # pinned revision, else downloaded in the sandbox (6.2 GB). Fill `hf_seed` once with
    # `hf download Qwen/Qwen2.5-3B-Instruct --revision aa8e72537993ba99e69dfaafa59ed015b17504d1
    # --cache-dir <folder>/hub`.
    model_cache: auto

    # As original.yaml (D-099).
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6`.
model: anthropic/claude-sonnet-4-6

# As original.yaml (D-010).
generate_config: {}

# Three trials, as in original.yaml (`--epochs 1` runs one). One sample at a time: the scores
# are timings on the machine's one GPU, so two samples at once would time each other's servers.
eval_config:
  epochs: 3
  max_samples: 1
