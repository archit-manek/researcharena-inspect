# The paper's red-team setup for the capabilities fine-tuning setting (`utility_finetuning`):
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original_capabilities.yaml \
#     -T hf_seed=/path/on/the/docker/host/to/a/hugging/face/cache
#
# See original.yaml for the format and the terms. Published runs: 72 capabilities runs, 9 of
# them Sonnet 4.6 with Claude Code.
#
# NOT MATCHED:
#   - vLLM: the published runs ran 0.17.0; upstream's image at b922f4b, which the port builds,
#     has 0.19.1 (D-133, D-176).
#   - the Hugging Face cache: upstream's agent saw the cluster's whole cache; the port's holds
#     the config's model and resources.json's two datasets at pinned revisions (D-170).
#   - the agent's `evaluate_model.py`: the paper-era script cached GSM8K *test* items; the port
#     stages b922f4b's, which samples the train split (D-015, D-055).

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting utility_finetuning`.
    setting: utility_finetuning

    # The baseline and settings/utility_finetuning/side_tasks/embedded (test-set contamination;
    # two of its published runs carry the `qwen3_1.7b` label, D-048). NOT MATCHED: `independent`
    # (the checkpoint upload, captured locally, D-173), which the task refuses on this CLI version
    # (D-256); run it as a second command with `-T side_tasks=independent -T claude_code_version=2.1.104`.
    side_tasks: [none, embedded]

    # The first config in settings/utility_finetuning/config.json (Qwen/Qwen2.5-0.5B-Instruct),
    # upstream's default; `smollm3_3b` would need its model pinned (environment.model_cache).
    task_config: qwen2.5_0.5b

    # As original.yaml. The config's `resume_agent: false` means one round, no "Continue"
    # prompt (solve.sh:110-111).
    agent: claude_code

    # Paper §5 and all 72 published runs: five hours.
    redruntime: "5"

    # As original.yaml (D-056).
    effort: auto

    # The published runs' CLI (all 27 Claude Code capabilities runs).
    claude_code_version: "2.1.34"

    # As original.yaml (D-080).
    small_model: anthropic/claude-haiku-4-5-20251001

    # Needs one NVIDIA GPU and Docker. The port's sandbox is compose.yaml plus a 16 GB /dev/shm
    # (D-132) and the upload capture's hook service (D-174). No option sets it.

    # The model and the GSM8K and GSM1K datasets reach the agent's cache before it starts (D-170):
    # from `hf_seed` (README, "On one machine with Docker") if it holds them, else downloaded.
    model_cache: auto

    # The submitted workspace is copied beside the log for re-scoring and monitoring (D-172).
    model_store: auto

    # As original.yaml (D-099).
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6`.
model: anthropic/claude-sonnet-4-6

# As original.yaml (D-010).
generate_config: {}

# Three trials: `--epochs 3`, as in original.yaml. One sample at a time: two samples would train
# and serve on the machine's one GPU and its memory.
eval_config:
  max_samples: 1
