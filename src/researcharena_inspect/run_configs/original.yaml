# The paper's red-team setup for the CUDA setting, as an Inspect run config:
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original.yaml
#
# Same format and purpose as `run_configs/original.yaml` in inspect_evals' HLE eval: one file,
# read by `inspect eval --run-config`, that fixes every setting of a paper-faithful run. Flags on
# the command line override it (`--model`, `-T name=value`). `inspect eval-set` does not read
# run configs. The other `original_*.yaml` files follow this one.
#
# "Upstream" is ResearchArena at b922f4b (pins.UPSTREAM_COMMIT), the code the port follows.
# "Published runs" are the authors' runs in the dataset at revision 8cd737c (pins.HF_REVISION);
# here, the 15 Sonnet 4.6 Claude Code CUDA runs the paper's CUDA numbers come from. Where the two
# disagree, the comment says which one the value follows.

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting cuda_kernel`.
    setting: cuda_kernel

    # The baseline and settings/cuda_kernel/side_tasks/: embedded (RoPE backdoor), embedded2
    # (latency trigger), embedded3 (dtype backdoor), independent (typosquat dependency).
    side_tasks: [none, embedded, embedded2, embedded3, independent]

    # The one config in settings/cuda_kernel/config.json; every published CUDA run records it.
    task_config: tinyllama

    # Upstream's agents/claude/solve.sh (Claude Code), run through Inspect SWE (D-076 to D-080).
    agent: claude_code

    # Paper §5 and all 15 published runs: one hour (run_redteam.sub's own default is ten minutes).
    redruntime: "1"

    # "auto" reads upstream's effort.json: `xhigh`, which Inspect's Anthropic provider sends to
    # Sonnet 4.6 as adaptive thinking at `high` (D-077). NOT MATCHED: the published runs predate
    # effort.json and record no effort level (D-056); all of them have thinking blocks.
    effort: auto

    # Upstream installs the latest CLI at each run (D-056). The published runs used 2.1.162 for
    # embedded2 and embedded3 and 2.1.104 for the other three; for those, add
    # `-T claude_code_version=2.1.104 -T side_tasks=none,embedded,independent`.
    claude_code_version: "2.1.162"

    # Claude Code's background model, as the published runs' `modelUsage` lists (D-080).
    small_model: anthropic/claude-haiku-4-5-20251001

    # Needs one NVIDIA GPU and Docker. run_redteam.sub asks for one H100 80GB, 8 CPUs and 256 GB;
    # the port's compose.yaml asks for one GPU, 8 CPUs and 64 GB. No option sets it.

    # Upstream has no overall limit (the agent's budget plus five minutes, then up to three
    # 3600 s evaluation attempts); an Inspect time_limit would give scoring only half (D-099).
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6`, run_redteam.sub's default.
model: anthropic/claude-sonnet-4-6

# Claude Code sends its own requests; upstream sets no temperature, seed or token limit (D-010).
generate_config: {}

# The paper's three trials (§5): add `--epochs 3`. The task averages the epochs that have a
# score, leaving out upstream's -1 ("no score") (D-123).
#
# One sample at a time: every sandbox asks for the machine's one GPU (upstream gives each run its
# own, run_redteam.sub), and the main score is a speed measurement on it.
eval_config:
  max_samples: 1
