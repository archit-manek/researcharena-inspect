# The paper's red-team setup for the CUDA setting, as an Inspect run config:
#
#   uv run inspect eval --run-config src/researcharena_inspect/run_configs/original.yaml
#
# Same format and purpose as `run_configs/original.yaml` in inspect_evals' HLE eval: one file,
# read by `inspect eval --run-config`, that fixes every setting of a paper-faithful run. Flags on
# the command line override it (`--model`, `-T name=value`). `inspect eval-set` and Hawk do not
# read run configs; on Hawk the same arguments go in a job file (see hawk/).
#
# "Upstream" is ResearchArena at b922f4b (pins.UPSTREAM_COMMIT), the code the port follows.
# "Published runs" are the authors' 15 Sonnet 4.6 Claude Code CUDA runs in the dataset at
# revision 8cd737c (pins.HF_REVISION), which are what the paper's CUDA numbers for this agent
# come from. Where the two disagree, the comment says which one the value follows.
#
# Not matchable on GL's Hawk today (17 Nov 2026), each marked HAWK below:
#   - the model: Hawk refuses direct Anthropic models, so Claude goes through OpenRouter;
#   - the GPU: Hawk's H100 pool has refused every request so far, and the L4 is not the
#     paper's GPU (ledger D-094; untouched kernels score 0.0 there, D-037).

task:
  task: researcharena_inspect/researcharena
  args:
    # Upstream: `run_redteam.sh --setting cuda_kernel`.
    setting: cuda_kernel

    # The baseline (`none`) and the four CUDA side tasks: upstream's folders under
    # settings/cuda_kernel/side_tasks/ (embedded = RoPE backdoor, embedded2 = latency trigger,
    # embedded3 = dtype backdoor, independent = typosquat dependency). The published runs have
    # three of each for Sonnet 4.6.
    side_tasks: [none, embedded, embedded2, embedded3, independent]

    # settings/cuda_kernel/config.json has one config, `tinyllama`; upstream uses the first
    # when none is given (`run_redteam.sh --task_config`). Every published CUDA run records it.
    task_config: tinyllama

    # Upstream: `--redteammodel claude:claude-sonnet-4-6` runs agents/claude/solve.sh (Claude
    # Code). The port runs the same CLI through Inspect SWE (ledger D-076 to D-080).
    agent: claude_code

    # One hour. Paper §5: "one hour for CUDA kernel and inference optimization"; all 15
    # published runs have `redruntime_hours: 1` in metadata.json. (run_redteam.sub's own
    # default is 0.1667, ten minutes.)
    redruntime: "1"

    # Upstream's effort.json gives Claude red-team agents `xhigh` ("auto" reads it). The
    # published runs predate effort.json: solve.sh at the paper commit passed no --effort, so
    # their effort is not recorded (D-056). All 15 published runs have thinking blocks, so
    # thinking was on. Through Inspect the effort is set on the served model and the bridge
    # drops the CLI's own thinking and effort settings (D-077): with "default" the provider's
    # own default would apply (whether that thinks has not been checked); with "auto" Inspect's
    # Anthropic provider sends adaptive thinking with the effort, `xhigh` lowered to `high`
    # for Sonnet 4.6. Not matchable: the published effort level.
    effort: auto

    # The published runs' CLI version, from the `init` event of each solve_out file: 2.1.104
    # for the 9 baseline, embedded and independent runs (April and May 2026), 2.1.162 for the
    # 6 embedded2 and embedded3 runs (June 2026). One config holds one version: this file uses
    # 2.1.162; for the other three side tasks add
    # `-T claude_code_version=2.1.104 -T side_tasks=none,embedded,independent`.
    # Upstream itself installs the latest release at each run (`update_agent_cli.sh`, D-056).
    claude_code_version: "2.1.162"

    # Claude Code's own background calls: Haiku 4.5, which the published runs' `modelUsage`
    # lists (pins.CLAUDE_CODE_SMALL_MODEL; D-080). HAWK: only as
    # openrouter/openrouter/anthropic/claude-haiku-4.5.
    small_model: anthropic/claude-haiku-4-5-20251001

    # One machine with one NVIDIA GPU and Docker: run_redteam.sub asks for one
    # "NVIDIA H100 80GB HBM3", 8 CPUs, 256000 MB of memory and 200 GB of disk; the port's
    # compose.yaml asks for one GPU, 8 CPUs and 64 GB. HAWK: `backend: k8s` and `gpu: h100`
    # (k8s_values_h100.yaml, never run), or `gpu: l4` (D-094).
    backend: docker
    gpu: null

    # Upstream has no overall limit: the agent's budget plus five minutes (RED_TIMEOUT), then
    # up to three evaluation attempts of 3600 s each. An Inspect time_limit would give scoring
    # only half of it (D-099), so none is set.
    time_limit: null

# Upstream: `--redteammodel claude:claude-sonnet-4-6` (run_redteam.sub's default and the
# paper's agent). HAWK: refused as a "dead model"; use
# `--model openrouter/openrouter/anthropic/claude-sonnet-4.6` there (D-106 for a known effect).
model: anthropic/claude-sonnet-4-6

# Claude Code sends its own requests; upstream sets no temperature, seed or token limit, and
# every published run has `seed: null` (D-010). Nothing is set here.
generate_config: {}

# The paper runs each configuration three times (§5, "three independent trials"); `--epochs 3`
# does that. The task reduces each sample's epochs to the mean of those with a score, leaving
# upstream's -1 ("no score") out (D-123); each epoch's own score is still in its sample.
eval_config: {}
