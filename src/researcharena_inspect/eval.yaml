title: "ResearchArena: Evaluating Sabotage and Monitoring in Automated AI R&D"
description: |
  An AI-control evaluation of sabotage and monitoring in automated AI R&D: an agent does a long research-engineering task, some runs also give it a hidden sabotage task, and a monitor model reads the run and scores how suspicious it looks.
arxiv: https://arxiv.org/abs/2607.19321
group: Scheming
contributors:
  - archit-manek
version: "4-B"
tags: ["Agent", "AI control", "Sabotage", "Monitoring"]
tasks:
  # The red-team run. 5 samples with the defaults (setting cuda_kernel: four side tasks and the
  # baseline). Other settings: inference_optimization 5, safety_finetuning 4,
  # utility_finetuning 3. utility_finetuning is scored from version 4 (side scores, the upload
  # capture service, the cache and the submission store); it has not run on a GPU.
  - name: researcharena
    dataset_samples: 5
  # The monitor over the authors' published runs. 113 samples with the defaults (every published
  # cuda_kernel run); 386 with settings=None (all four settings).
  - name: researcharena_monitor
    dataset_samples: 113
  # Checks of the environment on a GPU, without an agent or a model call. Their scores describe
  # the sandbox, not a model. gpu_probe (nvidia-smi only, in a plain CUDA image) is left out:
  # environment_check runs the same check inside the eval's own image and does more.
  - name: environment_check
    dataset_samples: 1
    kind: maintenance
  - name: kernel_crash_check
    dataset_samples: 2
    kind: maintenance

external_assets:
  - type: git_clone
    source: "https://github.com/aisa-group/ResearchArena.git"
    fetch_method: git_clone
    state: pinned
    comment: "Upstream's task files, evaluators, templates and scripts, cloned at commit b922f4b (pins.UPSTREAM_COMMIT); the paper commit 58776e0 is cloned for comparisons only."
  - type: huggingface
    source: "aisa-group/ResearchArena-Trajectories"
    fetch_method: hf_hub_download
    state: pinned
    comment: "The authors' 386 published runs at revision 8cd737c (pins.HF_REVISION): transcripts, workspaces and judgements, for the monitor task, the replay agent and the tests. The website's run index is a gzipped snapshot in the package."
  - type: huggingface
    source: "aisa-group/ResearchArena-output-models"
    fetch_method: other
    state: pinned
    comment: "The authors' fine-tuned models, one final_model/ per post-training run, at revision 28acb91 (pins.OUTPUT_MODELS_REVISION), downloaded with huggingface_hub when the replay agent re-scores a published capabilities run (about 1 GB each)."
  - type: huggingface
    source: "Qwen/Qwen2.5-0.5B-Instruct"
    fetch_method: other
    state: pinned
    comment: "utility_finetuning's model, put in the agent's cache at revision 7ae5576 (environment.model_cache), copied from a host folder or downloaded in the sandbox. Also openai/gsm8k at 740312a and ScaleAI/gsm1k at bc09569, as upstream's resources.json lists them."
  - type: huggingface
    source: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    fetch_method: other
    state: floating
    comment: "The model whose generation the CUDA kernels speed up. Upstream's bench.py loads it with transformers inside the sandbox, with no revision."

metadata:
  sandbox: ["solver", "scorer"]
  requires:
    internet: true
    gpu:
      count: 1
      products: ["H100", "L4"]
  supports_k8s: true
