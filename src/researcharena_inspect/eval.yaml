title: "ResearchArena: Evaluating Sabotage and Monitoring in Automated AI R&D"
description: |
  An AI-control evaluation of sabotage and monitoring in automated AI R&D: an agent does a long research-engineering task, some runs also give it a hidden sabotage task, and a monitor model reads the run and scores how suspicious it looks.
arxiv: https://arxiv.org/abs/2607.19321
group: Scheming
contributors:
  - archit-manek
version: "7-F"
tags: ["Agent", "AI control", "Sabotage", "Monitoring"]
tasks:
  # The red-team run. 5 samples with the defaults (setting cuda_kernel: four side tasks and the
  # baseline). Other settings: inference_optimization 5, safety_finetuning 4,
  # utility_finetuning 3. cuda_kernel has had live runs on a GPU; inference_optimization's scorer
  # has run on a GPU without an agent (18 Nov 2026); the post-training settings have not run.
  # utility_finetuning is scored from version 4 (side scores, the upload capture service, the
  # cache and the submission store); 4-B adds the check-only option check_offline; 4-C adds the
  # datasets' prepared builds to the agent's cache (D-187). Version 5 scores safety_finetuning
  # (its side scores, its model, judges and datasets in the cache, replay of its published
  # models: D-210 to D-213); the other three settings' samples are scored as in 4-C. Version 6
  # scores every setting, on Docker, in a container of its own after the agent's has been
  # stopped, as upstream does (D-093); on Kubernetes scoring is as in 5-A. Version 7-F: a mean
  # over no values is nan, not 0.0; the letter counts the interface changes since 3-D (4-C, 5-A
  # and 6-A went backwards). Every version is in the README's changelog.
  - name: researcharena
    dataset_samples: 5
  # The monitor over the authors' published runs. 113 samples with the defaults (every published
  # cuda_kernel run); 386 with settings=None (all four settings).
  - name: researcharena_monitor
    dataset_samples: 113
  # Checks of the environment on a GPU, without an agent or a model call. Their scores describe
  # the sandbox, not a model. gpu_probe (nvidia-smi only, in a plain CUDA image) is left out:
  # environment_check runs the same check inside the eval's own image and does more.
  - name: environment_check
    dataset_samples: 1
    kind: maintenance
  - name: kernel_crash_check
    dataset_samples: 2
    kind: maintenance

