# Docker sandbox for the agent on one machine with an NVIDIA GPU and the NVIDIA Container
# Toolkit. Built by researcharena_inspect.environment.sandbox_spec("docker"); see sandbox.py.
#
# Upstream's request (run.sub): 8 CPUs, 64 GB, one GPU. The default bridge network leaves the
# internet open, as upstream does (ledger D-029). The red-team task adds a second service of
# the same image and GPU, where upstream's evaluator runs (sandbox.with_evaluator, D-093).
services:
  default:
    image: ghcr.io/archit-manek/researcharena-inspect/arena@sha256:e1cebf2cfc3a3868b272d91413275d884095b930f97475a2180ea1f95ca68d5d
    platform: linux/amd64
    command: ["tail", "-f", "/dev/null"]
    init: true
    cpus: 8
    mem_limit: 64g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
