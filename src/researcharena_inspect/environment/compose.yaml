# Docker sandbox for the agent: one NVIDIA GPU (NVIDIA Container Toolkit), 8 CPUs and 64 GB
# as upstream's run.sub asks (D-261). Open network, as upstream's (D-029).
# sandbox.py adds to it, including the evaluator's service (D-093).
services:
  default:
    image: ghcr.io/archit-manek/researcharena-inspect/arena@sha256:e1cebf2cfc3a3868b272d91413275d884095b930f97475a2180ea1f95ca68d5d
    platform: linux/amd64
    command: ["tail", "-f", "/dev/null"]
    init: true
    cpus: 8
    mem_limit: 64g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
