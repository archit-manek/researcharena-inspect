# Kubernetes sandbox for the agent on Hawk's H100 pool (p5.4xlarge): one container, one GPU.
# Built by researcharena_inspect.environment.sandbox_spec("k8s", "h100"); see sandbox.py.
#
# Upstream's request (run.sub): 8 CPUs, 64 GB, 100 GB of disk, one "NVIDIA H100 80GB HBM3".
# allowEntities [world] opens the network as upstream leaves it (ledger D-029). No
# runtimeClassName: Hawk runs a GPU service on the node's default runtime and adds the GPU
# pool's toleration itself. Not run yet.
services:
  default:
    image: ghcr.io/archit-manek/researcharena-inspect/arena@sha256:e1cebf2cfc3a3868b272d91413275d884095b930f97475a2180ea1f95ca68d5d
    nodeSelector:
      karpenter.k8s.aws/instance-gpu-name: h100
    resources:
      requests:
        cpu: "8"
        memory: 64Gi
        ephemeral-storage: 100Gi
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: 64Gi
        nvidia.com/gpu: 1
allowEntities:
  - world
