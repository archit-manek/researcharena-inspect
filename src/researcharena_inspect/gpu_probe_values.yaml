# Sandbox for the gpu_probe task: one container that asks the cluster for one GPU.
#
# No runtimeClassName on purpose: gVisor cannot pass a GPU through, and Hawk keeps a service
# that requests a GPU on the node's default runtime. Hawk adds the toleration for its tainted
# GPU node pool to any service that requests nvidia.com/gpu.
services:
  default:
    image: nvidia/cuda:12.9.1-base-ubuntu22.04
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "1"
        memory: "4Gi"
        nvidia.com/gpu: 1
